<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <path id="topArc" d="M 46,266 A 210,210 0 0 1 466,266" fill="none"/>
    <path id="bottomArc" d="M 70,300 A 186,186 0 0 0 442,300" fill="none"/>
  </defs>

  <!-- anillo exterior oscuro -->
  <circle cx="256" cy="256" r="252" fill="#0f1f38"/>
  <!-- anillo naranja institucional (Protección Civil) -->
  <circle cx="256" cy="256" r="244" fill="#F4791D"/>
  <!-- círculo blanco interior -->
  <circle cx="256" cy="256" r="192" fill="#ffffff"/>
  <!-- línea fina que separa el anillo naranja del blanco -->
  <circle cx="256" cy="256" r="192" fill="none" stroke="#e2601a" stroke-width="2"/>

  <!-- texto institucional arqueado -->
  <text font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="800" fill="#ffffff" letter-spacing="0.2">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">PROTECCIÓN CIVIL Y ADMINISTRACIÓN DE DESASTRES</textPath>
  </text>

  <!-- estrellas decorativas en la base del anillo -->
  <text font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#ffffff">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">★ ★ ★ ★ ★ ★ ★</textPath>
  </text>

  <!-- triángulo azul -->
  <polygon points="256,126 372,344 140,344" fill="#ffffff" stroke="#1B3F94" stroke-width="16" stroke-linejoin="round"/>

  <!-- letras PC -->
  <text x="256" y="272" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="800" fill="#1B3F94" text-anchor="middle">PC</text>
  <!-- VENEZUELA -->
  <text x="256" y="308" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#C81E1E" text-anchor="middle" letter-spacing="1">VENEZUELA</text>

  <!-- escudo/bandera pequeño en la base del triángulo -->
  <g transform="translate(256,344)">
    <circle r="27" fill="#ffffff" stroke="#0f1f38" stroke-width="3"/>
    <clipPath id="flagClip"><circle r="24"/></clipPath>
    <g clip-path="url(#flagClip)">
      <rect x="-26" y="-24" width="52" height="16" fill="#FCD116"/>
      <rect x="-26" y="-8"  width="52" height="16" fill="#00247D"/>
      <rect x="-26" y="8"   width="52" height="16" fill="#CF142B"/>
      <text x="0" y="-13" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" letter-spacing="1">★ ★ ★ ★ ★ ★ ★</text>
    </g>
  </g>
</svg>
